AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access
  
  EnvironmentName:
    Type: String
    Description: Environment name (dev)

Resources:
  VPNInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-VPNInstanceRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-VPNInstanceRole

  VPNInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${AWS::StackName}-VPNInstanceProfile
      Roles:
        - !Ref VPNInstanceRole

  VPNInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c02fb55956c7d316
      InstanceType: t3.micro
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref VPNInstanceProfile
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-VPNInstance
      SecurityGroupIds:
        - Fn::ImportValue: 
            Fn::Sub: ${EnvironmentName}-security-groups-WebSecurityGroup
      SubnetId: 
        Fn::ImportValue: 
          Fn::Sub: ${EnvironmentName}-network-stack-PublicSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          BRANCH="main"
          if [ "${EnvironmentName}" = "dev" ]; then
            BRANCH="dev/test"
          fi
          export BRANCH
          curl -fsSL https://raw.githubusercontent.com/Bantu-art/securewave-vpn/$BRANCH/scripts/install-wireguard.sh | bash

Outputs:
  VPNInstanceId:
    Description: VPN Instance ID
    Value: !Ref VPNInstance
    Export:
      Name: !Sub ${AWS::StackName}-VPNInstanceId

  VPNInstancePublicIP:
    Description: VPN Instance Public IP
    Value: !GetAtt VPNInstance.PublicIp
    Export:
      Name: !Sub ${AWS::StackName}-VPNInstancePublicIP
